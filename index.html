<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harder Army MMA - Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-gray-100 font-sans min-h-screen pb-20">

    <!-- Header / Navbar -->
    <header class="bg-zinc-950 border-b border-red-900/40 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-red-600 text-black font-black p-2 rounded-lg text-lg tracking-tighter">HA</div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wider text-red-600 leading-none">HARDER ARMY MMA</h1>
                    <p class="text-[10px] text-gray-400 font-medium tracking-widest mt-0.5">BAHÇEŞEHİR FIGHT CLUB</p>
                </div>
            </div>
            <button onclick="toggleSetup()" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-gray-400 px-3 py-1.5 rounded-lg border border-zinc-800">
                <i class="fa-solid fa-gear mr-1"></i> Ayarlar
            </button>
        </div>
    </header>

    <div class="max-w-5xl mx-auto p-4 space-y-6">

        <!-- Supabase Bağlantı Ayar Alanı -->
        <div id="setup-box" class="bg-zinc-900 border border-red-900/60 p-4 rounded-xl hidden shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-sm font-bold text-red-500">Supabase API Ayarları</h3>
                <button onclick="toggleSetup()" class="text-gray-400 text-xs"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                <input type="text" id="sb-url" placeholder="https://xyz.supabase.co" class="bg-black border border-zinc-800 p-2.5 rounded-lg text-xs text-white outline-none focus:border-red-600">
                <input type="text" id="sb-key" placeholder="sb_publishable_..." class="bg-black border border-zinc-800 p-2.5 rounded-lg text-xs text-white outline-none focus:border-red-600">
            </div>
            <button onclick="saveConfig()" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 rounded-lg transition">Bağlantıyı Kaydet</button>
        </div>

        <!-- İstatistik Özet Kartları -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-zinc-900 border border-zinc-800/80 p-3.5 rounded-xl">
                <p class="text-gray-400 text-[11px] font-medium">Aktif Sporcu</p>
                <p id="stat-aktif" class="text-2xl font-black text-white mt-1">0</p>
            </div>
            <div class="bg-zinc-900 border border-zinc-800/80 p-3.5 rounded-xl">
                <p class="text-gray-400 text-[11px] font-medium">Bitişi Yaklaşan</p>
                <p id="stat-biten" class="text-2xl font-black text-yellow-500 mt-1">0</p>
            </div>
            <div class="bg-zinc-900 border border-zinc-800/80 p-3.5 rounded-xl">
                <p class="text-gray-400 text-[11px] font-medium">Kasa Bakiyesi</p>
                <p id="stat-kasa" class="text-2xl font-black text-green-500 mt-1">₺0</p>
            </div>
            <div class="bg-zinc-900 border border-zinc-800/80 p-3.5 rounded-xl">
                <p class="text-gray-400 text-[11px] font-medium">Bu Ayki Net Kâr</p>
                <p id="stat-netkar" class="text-2xl font-black text-blue-400 mt-1">₺0</p>
            </div>
        </div>

        <!-- Sekme / Tab Butonları -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-1 bg-zinc-900 p-1.5 rounded-xl border border-zinc-800 text-xs font-bold">
            <button onclick="switchTab('uyeler')" id="tab-uyeler" class="py-2.5 rounded-lg bg-red-600 text-white transition">
                <i class="fa-solid fa-users mr-1"></i> Üyeler
            </button>
            <button onclick="switchTab('yoklama')" id="tab-yoklama" class="py-2.5 rounded-lg text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-clipboard-user mr-1"></i> Yoklama
            </button>
            <button onclick="switchTab('kasa')" id="tab-kasa" class="py-2.5 rounded-lg text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-wallet mr-1"></i> Kasa / Hareket
            </button>
            <button onclick="switchTab('rapor')" id="tab-rapor" class="py-2.5 rounded-lg text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-chart-pie mr-1"></i> K
